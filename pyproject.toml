[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kw-common"
dynamic = ["version"]
description = "Shared, stdlib-only building blocks for the fleet's Python services."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "texasdaddy" }]
keywords = ["alerting", "leak-guard", "ops"]
# ⭐ ONLY THE VERSIONS CI ACTUALLY RUNS. This list claimed 3.11 and 3.13 as well, which CI never
# measured — and this project's own README says a library that claims a version and is only ever
# run on another is claiming something nobody checked. `requires-python = ">=3.10"` remains the
# binding constraint, so 3.11 and 3.13 still install; the classifiers just stop asserting a
# result no run produced. Adding them back is a one-line matrix change in both workflows, and
# that is the order to do it in.
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: System :: Monitoring",
]

# ⭐ NO RUNTIME DEPENDENCIES, AND THAT IS A CONTRACT, NOT AN ACCIDENT.
# Every third-party dependency added here is a supply-chain surface across the WHOLE fleet at
# once, because every consumer installs this library. Adding one needs a stated justification,
# not just a convenience argument. `dependencies` is written out empty rather than omitted so
# that adding an entry is a visible diff on this line.
dependencies = []

# ⭐ THE LEAK GUARD IS A COMMAND, not only an importable module, because that is how a consumer
# actually uses it: one line in a CI job. The alternative — every repository writing
# `python -m kw_common.leakguard` — works too and stays supported, but a console script is what
# makes the guard reachable without knowing where the package was installed.
#
# ⚠️ `cli`, NOT `main`. `main(argv)` takes its arguments, which is what makes it testable; a
# console script is called with none. Pointing this entry at `main` would call it with no `argv`
# and fail at import time for every consumer, in a way nothing in this repository would notice.
[project.scripts]
kw-leak-guard = "kw_common.leakguard:cli"

[project.urls]
Homepage = "https://github.com/sdr-ventures/kw-common"
Issues = "https://github.com/sdr-ventures/kw-common/issues"

[tool.setuptools.dynamic]
# ⭐ ONE source of truth for the version: `src/kw_common/__init__.py`. Repeating the number here
# would be a second place to forget. The release workflow additionally asserts that the git TAG
# agrees with this value, which is the third place it could drift.
version = { attr = "kw_common.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# ⭐ PEP 561. Without `py.typed` INSIDE the installed package, a consumer's mypy treats
# `kw_common` as untyped and silently ignores every annotation in it — `disallow_untyped_defs`
# below runs over this repository's own source and proves nothing at all for anybody who installs
# it. The annotations were already written; the marker that says they may be used was not.
#
# ⚠️ THE MARKER IS DATA, NOT CODE — `packages.find` walks for `__init__.py` and takes `.py` files.
# This line is what names it explicitly.
#
# ⭐ MEASURED, because the obvious statement of why it is here turned out to be false. At
# setuptools 84 `py.typed` is an IMPLICIT data file and lands in both artifacts with neither this
# line nor `MANIFEST.in`'s; at the declared floor of 68 it lands with EITHER of them (this key, or
# the MANIFEST line via `include-package-data`, which defaults true for a pyproject project) and
# with NEITHER it is absent from both. So both lines are FLOOR INSURANCE and either alone would
# do today — which is a reason to keep them and not a reason to believe a story about them. What
# actually holds the line is the assertion both workflows make against the built wheel.
[tool.setuptools.package-data]
kw_common = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# ⭐ `BLE` IS SELECTED ON PURPOSE. The alerting module is full of deliberate broad excepts —
# "notify() never raises" is a structural guarantee, not a promise — and every one of them carries
# a `# noqa: BLE001` naming the reason it exists. Selecting the rule is what makes those comments
# load-bearing instead of decorative: a NEW unjustified `except Exception` fails the lint, and
# `RUF100` fails an obsolete suppression, so the set of blanket catches cannot grow silently.
select = ["E", "F", "W", "I", "UP", "B", "S", "BLE", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # `assert` is how the tests are written
    "RUF001", # ambiguous unicode in prose: the docstrings quote real characters on purpose
    "RUF002",
    "RUF003",
    # `__all__` is grouped by concern (severity / configuration / functions / constants) rather
    # than alphabetised, because it doubles as the map of the public surface.
    "RUF022",
]

[tool.ruff.lint.per-file-ignores]
# ⭐ TWO RULES, NOT `ALL`. While the guard was a verbatim copy of an upstream file it was exempt
# from linting entirely, because a local fix would have forked it. This repository now OWNS the
# engine, so the blanket exemption became a 2,900-line hole in the lint — and closing it cost
# exactly two suppressions and three real fixes.
#
# S603/S607 are `subprocess.run(["git", ...])`: the guard MUST use whatever `git` is on the
# caller's PATH, since that is the git whose repository it is scanning. An absolute path would be
# wrong rather than safer, and the argument lists are built here, never taken from a user.
"src/kw_common/leakguard.py" = ["S603", "S607"]
# S603: every subprocess call in the tests runs `sys.executable` on a file this suite just wrote.
# There is no untrusted input to audit, and the isolation tests cannot be written without it.
# S607: the leak-guard suites drive REAL `git` in scratch repositories, for the same reason the
# guard itself does — the git under test is whichever one the caller has.
"tests/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
disallow_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# ⭐ NO TEST MAY HANG. A hung process emits no output and is indistinguishable from a slow one;
# a per-test ceiling turns that into a fast, legible failure.
addopts = "-q --timeout=60"
filterwarnings = ["error"]
markers = [
    # Opts a test out of the autouse network block in `tests/conftest.py`. It exists for the
    # redirect-refusal tests, which have to drive `urllib`'s real handler stack against a
    # loopback server — a stub cannot answer what urllib does with a `3xx`. Registered here
    # because `filterwarnings = ["error"]` turns an unknown mark into a failure, which is what
    # keeps this list honest.
    "allow_loopback: may connect to 127.0.0.1 AND NOWHERE ELSE — conftest._no_network narrows the block for this test rather than lifting it",
]
