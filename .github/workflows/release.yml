name: release

# A release is an ANNOTATED semver tag. There is no image and nothing to deploy: this workflow
# builds the wheel + sdist and attaches them to a GitHub Release, which is what a consumer's
# pinned install resolves against.
#
#   pip install git+https://github.com/texasdaddy/kw-common@vX.Y.Z
#
# ⭐ A TAG CAN POINT AT ANY COMMIT — including one that never went through a PR and so never ran
# ci.yml. That is why the gates below are duplicated here rather than assumed: the guard, the
# full matrix and the packaging check all run again, against the TAG's tree, and the publish
# waits on every one of them.
on:
  # A webhook-independent way to start a run when Actions is throttled. `ref` selects the tag.
  workflow_dispatch:
  push:
    tags: ["v*"]

# Workflow-level: READ ONLY. The gate jobs execute arbitrary tag-tree code (pytest) and must not
# hold a write-capable token; only the publish job gets write, scoped at the job level below.
permissions:
  contents: read

jobs:
  no-internal-info:
    name: No internal info (leak guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The range scan needs real history AND TAGS: `git describe` finds no previous release
          # on a shallow checkout and `git rev-list` then FAILS, which the script turns into
          # exit 1 rather than a silent zero-commit pass.
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # ⭐ THE GUARD SHIPS INSIDE THE PACKAGE, so it is installed rather than invoked by path —
      # the same as `ci.yml` and the same as every consumer will call it. This file used to run
      # `python scripts/check_no_internal_info.py`, which is a path that no longer exists: had it
      # been left, the first `v*` tag would have failed the publish with a FileNotFoundError, and
      # the failure would have looked like a broken workflow rather than a stale invocation.
      #
      # ⛔ `-e` IS LOAD-BEARING FOR THE RANGE SCAN BELOW (#13): the guard skips its own synthetic
      # deny corpus by PATH relative to the scanned root, and a range scan has no bytes to
      # recognise it by. An editable install resolves `__file__` inside this checkout; a
      # site-packages install does not, and the range scan over this repository's history then
      # reports the corpus. Same comment as `ci.yml`; `tests/test_leak_guard_hook.py` pins both.
      - name: Install the package (the guard ships inside it)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Self-test the patterns, then scan the working tree
        run: |
          kw-leak-guard --selftest
          kw-leak-guard
      # ⛔ AN EMPTY RANGE IS NOT A PASS. The guard's job is to scan the commits this tag
      # publishes, and "there were none to scan" must never be reported as "there was nothing
      # wrong". `--range` legitimately exits 0 on zero commits — correct for a pre-push hook,
      # which really can have nothing new — so the CALLER decides what empty means. Here it
      # means: look wider.
      #
      # Two ways an empty range arises on a tag, both real:
      #   * the FIRST release ever — there is no previous tag at all (this is v1.0.0's case);
      #   * a tag cut on the SAME commit as the previous release (a re-tag): every tag at HEAD
      #     is excluded below, so `describe` finds the release before that one and the range is
      #     then NOT empty — it is only empty when no earlier tag exists at all. (Walked by the
      #     audit; the earlier wording here called every re-tag an empty range.)
      # In each case fall back to scanning ALL history reachable from the tag. Slower, once, and
      # the only answer that cannot silently publish an unscanned commit.
      # ⭐⭐ THE RANGE NAMES THE TAG REF, NOT `HEAD` — and that is the whole point of this step
      # rather than a detail of it. A TAG ANNOTATION is free prose, authored at release time,
      # published verbatim on the Release page and carried into every clone. It is the ONLY text
      # a tag adds that is not already in the scanned commit history, and with `HEAD` in the
      # range the guard never reads it.
      #
      # Measured on this repository: a tag annotated with an RFC1918 address scans CLEAN as
      # `--range HEAD` (exit 0) and is CAUGHT as `--range refs/tags/<name>` (exit 1,
      # `<tag object>:6: private IPv4`). The guard has a purpose-written `<tag object>`
      # remediation branch — deleting and re-cutting the tag, no history rewrite — so it was
      # built for exactly this and the workflow simply was not asking. Naming the ref is a strict
      # superset: the same commits are covered either way, plus the tag object itself.
      - name: Scan the commits AND THE TAG OBJECT this tag would publish
        run: |
          set -eu
          # `$GITHUB_REF` (refs/tags/<name>), never the bare commit sha: the guard reads a tag
          # object only when the range NAMES it, so a tag cut at an already-merged commit would
          # otherwise resolve to zero commits and the annotation would go unread entirely.
          target="${GITHUB_REF}"
          # Exclude EVERY tag co-located with HEAD, not just this one, or a twin tag becomes the
          # base and the range collapses to nothing.
          excludes=""
          for t in $(git tag --points-at HEAD); do excludes="$excludes --exclude=$t"; done
          # shellcheck disable=SC2086
          base="$(git describe --tags --abbrev=0 --match 'v*' $excludes HEAD 2>/dev/null || true)"
          range=""
          count=0
          if [ -n "$base" ]; then
            # The base PEELED to its commit: a bare tag name in the range would re-scan the
            # previous release's annotation, which this tag does not publish.
            range="${base}^{commit}..${target}"
            count="$(git rev-list --count "$range")"
          fi
          if [ "$count" -eq 0 ]; then
            echo "no previous release tag to scan from (or nothing new since it) — scanning ALL"
            echo "history reachable from this tag rather than reporting an empty range as clean"
            range="${target}"
            count="$(git rev-list --count "${target}")"
          fi
          if [ "$count" -eq 0 ]; then
            echo "::error::no commits to scan at all. An unrunnable guard must never be"
            echo "::error::reported as a pass."
            exit 1
          fi
          echo "scanning ${range} (${count} commit(s), plus the tag object itself)"
          kw-leak-guard --range "$range"

  test:
    name: Lint, type-check and test the tagged tree (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and the pinned tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff==0.16.1" "mypy==2.3.0" "pytest==9.1.1" \
                                "pytest-timeout==2.4.0"
      # Named, like their `ci.yml` twins, so the step-name comparison in
      # `tests/test_leak_guard_hook.py` can see them: an anonymous step is invisible to it.
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Test
        run: python -u -m pytest

  build:
    name: Build the wheel and sdist
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # `fetch-tags` so the TAG OBJECT itself is in the local repository, not merely the
          # commit it points at. The annotated-tag check below reads that object with
          # `git cat-file -t`, and a checkout that resolved the ref to a commit without keeping
          # the tag would make the check unable to answer — which, on a publish path, must never
          # be indistinguishable from "it answered yes".
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"  # the declared FLOOR — build and prove the install there
      # ⭐ THE TAG AND THE PACKAGE VERSION MUST AGREE, and nothing else checks it. A consumer
      # pins `@v1.2.3` and then reads `kw_common.__version__` to report what it is running; if
      # the tag says one number and the package says another, every consumer's version report is
      # a lie and there is no way to tell from the outside which is right. `__init__.py` is the
      # single source (pyproject reads it dynamically), so this compares the tag against it.
      # ⭐ ANNOTATED, NOT LIGHTWEIGHT — and enforced, because README.md and CHANGELOG.md both
      # state it as a fact. `on: push: tags: ["v*"]` fires identically for `git tag v1.0.1`, so
      # without this step the stated invariant was documentation only and a lightweight tag would
      # publish a full release. An annotated tag carries a tagger, a date and a message; that is
      # what makes a release object something you can audit later.
      - name: The tag must be annotated
        run: |
          set -eu
          # ⛔ THREE OUTCOMES, NOT TWO, and each says what actually happened. Every one of them
          # fails closed — an unanswerable check must never read as a pass on a publish path —
          # but a failure that misdescribes itself sends the next person to fix the wrong thing.
          #
          # `|| true` on the substitution because `set -e` would otherwise abort the whole
          # step here on an unresolvable ref — and with `2>/dev/null` on the same line the
          # step would then fail having printed NOTHING at all, rather than the guidance
          # below. The redirect and the `|| true` are a pair; removing either loses the
          # message.
          if [ "${GITHUB_REF}" = "${GITHUB_REF#refs/tags/}" ]; then
            # workflow_dispatch on a BRANCH. The file documents that entry point, so it is a real
            # path — and telling someone to `git tag -d main` would be actively harmful advice.
            echo "::error::${GITHUB_REF} is not a tag ref. This workflow publishes a release from"
            echo "::error::an annotated v* TAG; re-run it with 'ref' set to the tag."
            exit 1
          fi
          kind="$(git cat-file -t "${GITHUB_REF}" 2>/dev/null || true)"
          if [ -z "$kind" ]; then
            echo "::error::${GITHUB_REF} could not be resolved in this checkout, so whether it is"
            echo "::error::annotated cannot be determined. This is an environment failure, not a"
            echo "::error::verdict on the tag — the checkout needs fetch-depth: 0 + fetch-tags."
            exit 1
          fi
          echo "${GITHUB_REF} is a ${kind} object"
          if [ "$kind" != "tag" ]; then
            echo "::error::${GITHUB_REF_NAME} is a LIGHTWEIGHT tag. A release must be annotated:"
            echo "::error::  git tag -d ${GITHUB_REF_NAME}"
            echo "::error::  git push origin :refs/tags/${GITHUB_REF_NAME}"
            echo "::error::  git tag -a ${GITHUB_REF_NAME} -m '<what this release is>'"
            echo "::error::  git push origin ${GITHUB_REF_NAME}"
            exit 1
          fi
      # ⭐ A RELEASE CANDIDATE IS `v<package version>rcN` (#37) and publishes as a PRE-RELEASE of
      # that version, so an rc is cut from the PR branch without a version-bump commit and a
      # consumer's `dev` line can pin it. The package still reports `X.Y.Z`; the tag is what says
      # "candidate". Anything else must equal `v<package version>` exactly. `version` and
      # `prerelease` are this job's outputs, read by the wheel check below and by `publish`.
      - name: The tag must match the package version
        id: version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          pkg="v$(python -c "
          import ast, pathlib
          src = pathlib.Path('src/kw_common/__init__.py').read_text(encoding='utf-8')
          tree = ast.parse(src)
          for node in tree.body:
              if isinstance(node, ast.Assign) and node.targets[0].id == '__version__':
                  print(node.value.value)
                  break
          else:
              raise SystemExit('__version__ not found in src/kw_common/__init__.py')
          ")"
          echo "tag=${tag}  package=${pkg}"
          prerelease=false
          candidate_of=""
          # rc1 upwards, no leading zero; a package that is itself an rc takes no second suffix.
          if [[ "$tag" =~ ^(.+)rc[1-9][0-9]*$ ]]; then
            prerelease=true
            candidate_of="${BASH_REMATCH[1]}"
            if [[ "$candidate_of" == *rc* ]]; then candidate_of=""; fi
          fi
          if [ "$tag" != "$pkg" ] && [ "$candidate_of" != "$pkg" ]; then
            echo "::error::tag ${tag} does not match the package version ${pkg}."
            echo "::error::A release is ${pkg}, a candidate for it is ${pkg}rcN."
            echo "::error::Bump __version__ in src/kw_common/__init__.py, or retag."
            exit 1
          fi
          echo "version=${pkg#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "publishing ${tag}: version=${pkg#v} prerelease=${prerelease}"
      # ⭐ THE SAME SDIST INSPECTION `ci.yml` RUNS, DUPLICATED HERE ON PURPOSE — this is the job
      # that UPLOADS the tarball to the Release, and the header of this file promises the
      # packaging check runs again against the tag's tree. It did not: the check was added to
      # `ci.yml` alone, so a tag cut directly on a commit that never went through a PR — the
      # exact case this file's duplication exists for — could publish a tarball nobody inspected.
      # Adding it to one of the two workflows and not the other is the same fix-the-instance miss
      # this repository keeps making, so it is stated here rather than assumed.
      #
      # ⭐⭐ AND IT HAPPENED AGAIN, TO THIS VERY COMMENT: 1.3.0 added the `py.typed` assertion to
      # `ci.yml` and not here. Stating the rule in prose did not make anybody follow it, so it is
      # a TEST now — `tests/test_leak_guard_hook.py::test_the_PUBLISHING_workflow_carries_every_
      # packaging_assertion_the_PR_workflow_does` compares the two step lists and fails when they
      # diverge. Add a packaging check to one workflow and that test tells you about the other.
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: The sdist carries its fixtures and nothing it should not
        run: |
          set -eu
          sdist="$(ls dist/*.tar.gz)"
          echo "inspecting ${sdist}"
          names="$(tar tzf "$sdist")"
          for required in '/tests/conftest.py' '/.leakguard.json' '/.github/workflows/ci.yml' \
                          '/alerting.env.template' '/docs/alerting-setup.md' \
                          '/.githooks/pre-push'; do
            # ⛔ ANCHORED AT THE TOP OF THE TARBALL, not only on the right. `"${required}\$"` alone
            # is satisfied at ANY depth — a `vendor/tests/conftest.py` with no top-level
            # `tests/conftest.py` passed this roll-call (measured by the audit). The tarball's
            # names all begin with ONE directory (`kw_common-X.Y.Z/`), so exactly one
            # slash-free component may precede the required path.
            echo "$names" | grep -q "^[^/]*${required}\$" || {
              echo "::error::the sdist has no ${required} — its suite ships without something it"
              echo "::error::depends on. Check MANIFEST.in."
              exit 1
            }
          done
          if echo "$names" | grep -q '/scripts/'; then
            echo "::error::the sdist contains scripts/. The leak guard ships as"
            echo "::error::kw_common.leakguard now; a second vendored copy is a fork waiting to"
            echo "::error::happen. Check MANIFEST.in."
            exit 1
          fi
          echo "sdist contents are as intended"
      # ⭐ ASKED OF THE BUILT WHEEL, AND ASKED HERE BECAUSE THIS IS THE JOB THAT PUBLISHES IT.
      # `py.typed` is DATA, so it can be committed, read as done, and be absent from the artifact —
      # and every other check in this job passes on a wheel without it (measured: the import
      # assertions below exit 0 on exactly that wheel). A consumer's mypy then silently ignores
      # every annotation in the package.
      #
      # ⚠️ This step first existed in `ci.yml` ALONE — the miss the comment above the sdist check
      # warns about, committed one step later in the same change. The test named in that comment
      # is what now says so before a human has to notice.
      - name: The wheel carries PEP 561's py.typed marker
        run: |
          set -eu
          wheel="$(ls dist/*.whl)"
          python - "$wheel" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          if "kw_common/py.typed" not in names:
              print("::error::the wheel has no kw_common/py.typed, so a consumer's mypy will")
              print("::error::ignore every annotation in this package. Check "
                    "[tool.setuptools.package-data] in pyproject.toml.")
              raise SystemExit(1)
          print("py.typed is in the wheel")
          PY
      # ⭐⭐ AND RUN IT, which is the check the list above cannot be. That list has been wrong every
      # time it was extended, and looked complete every time (the running count and the roll-call
      # live in `MANIFEST.in`). Unpacking the tarball and running its tests asks the question
      # `README.md` actually promises: do the tests travel? Duplicated from `ci.yml` deliberately,
      # per this file's header: a tag can point at a commit that never went through a PR.
      - name: The sdist's own test suite passes
        run: |
          set -eu
          sdist="$(ls dist/*.tar.gz)"
          rm -rf /tmp/sdist && mkdir -p /tmp/sdist
          tar xzf "$sdist" -C /tmp/sdist
          unpacked="$(ls -d /tmp/sdist/*/)"
          python -m venv /tmp/sdisttest
          /tmp/sdisttest/bin/python -m pip install --upgrade pip
          /tmp/sdisttest/bin/python -m pip install "$unpacked"
          /tmp/sdisttest/bin/python -m pip install "pytest==9.1.1" "pytest-timeout==2.4.0"
          cd "$unpacked"
          git config --global init.defaultBranch main
          /tmp/sdisttest/bin/python -u -m pytest
      # The same check ci.yml runs, repeated here because THIS is the artifact being published.
      - name: Install the built wheel into a clean environment and import it
        env:
          # The PACKAGE version the tag was checked against: an rc tag carries a suffix the
          # package does not (#37).
          PKG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          python -m venv /tmp/consumer
          /tmp/consumer/bin/python -m pip install --upgrade pip
          /tmp/consumer/bin/python -m pip install --no-index dist/*.whl
          cd /tmp
          /tmp/consumer/bin/python -c "
          import kw_common, kw_common.alerting as a, kw_common.leakguard as g
          import kw_common.alerting_env as e
          import os
          assert os.environ['PKG_VERSION'] and kw_common.__version__ == os.environ['PKG_VERSION'], (
              kw_common.__version__, os.environ['PKG_VERSION'], os.environ['GITHUB_REF_NAME'])
          assert a.notify and a.AlertSettings and a.configure
          assert g.main and g.cli and g.load_config and g.CONFIG_FILENAME == '.leakguard.json'
          # The environment layer, from the PUBLISHED wheel. The three variable names are what a
          # container template declares, so they are asserted rather than merely imported.
          assert e.load_alert_settings and e.load_alert_settings_from_env and e.validate_boot
          assert (e.SHARED_ROOT_VAR, e.CONFIG_PATH_VAR, e.DEPLOY_ENV_VAR) == (
              'SHARED_ROOT', 'CONFIG_PATH', 'DEPLOY_ENV')
          assert e.CONFIG_RELPATH == 'configs/alerting.env'
          print('installed', kw_common.__version__, 'with',
                len(a.__all__), '+', len(e.__all__), '+', len(g.__all__), 'exports')
          "
      # ⭐ THE CONSOLE SCRIPT IS A SEPARATE CLAIM FROM THE IMPORT, and it is the one a consumer's
      # CI depends on. An entry point aimed at the wrong callable installs fine, imports fine, and
      # fails the first time anybody runs it — in their repository, after the tag.
      - name: The installed console script runs against this tag's tree
        run: |
          set -eu
          /tmp/consumer/bin/kw-leak-guard --selftest
          /tmp/consumer/bin/kw-leak-guard --repo "$GITHUB_WORKSPACE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Create the GitHub Release
    needs: [no-internal-info, test, build]
    runs-on: ubuntu-latest
    # The ONLY job with write access, and it runs nothing from the tag's tree.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - name: Extract the release notes from CHANGELOG.md
        env:
          # The package version, not the tag: an rc's notes are its release's section (#37).
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -eu
          [ -n "${VERSION}" ] || { echo "::error::the build job published no version"; exit 1; }
          awk -v hdr="## [${VERSION}]" '
            index($0, hdr) == 1 {f=1; next}
            f && index($0, "## [") == 1 {exit}
            f {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG section for ${VERSION}; using a default note."
            echo "Release ${GITHUB_REF_NAME}." > release_notes.md
          fi
          echo "--- release notes ---"
          cat release_notes.md
      - name: Create the release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          # `true` only for a `vX.Y.ZrcN` tag (#37); a pre-release is never marked "latest".
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
