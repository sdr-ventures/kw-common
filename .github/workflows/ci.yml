name: CI

# Single-branch model: `feature/*` / `fix/*` → PR → `main`. There is no `dev` line, no container
# and no registry — this repository is a LIBRARY, and a release is an annotated `v*` tag handled
# by release.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A superseded PR run costs a runner slot something else needs. Cancel those — but never a
  # `main` push.
  #
  # ⚠️ THE SHA IN THE GROUP IS NOT DECORATION. For a push the expression below evaluates false,
  # and a FALSE `cancel-in-progress` does not mean "never cancelled": a group holds at most one
  # PENDING run, so on a shared group two merges inside one run's lifetime cancel the queued one
  # while it is still waiting — and that commit is never leak-scanned, linted or tested. Keying
  # push runs by SHA gives each commit its own group.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ⭐ EVERY JOB HERE RUNS ON GITHUB-HOSTED RUNNERS, AND THAT IS A SECURITY DECISION, NOT A DEFAULT.
# Several sibling repositories run CI on the self-hosted fleet. They are all PRIVATE and take no
# outside fork PRs, which is the argument that makes it safe there. **This repository is PUBLIC**,
# so a `pull_request` from any fork would execute that fork's `pytest` — arbitrary code — on a
# persistent machine inside a private network. Do not move these jobs to the fleet.

jobs:
  # ⚠️ A JOB NAME IS A STATUS-CHECK CONTEXT. If `main` is ever given branch protection listing
  # these names, renaming one does not fail the check — the required context simply never reports
  # and every PR sits BLOCKED with green jobs and no explanation. Change the protection rule
  # first, then the name.
  #
  # ⭐ SO THE NAMES ARE WRITTEN DOWN HERE, because a required-context list is invisible from
  # inside the repository — you cannot read it from a clone, and nothing fails when it drifts.
  # The contexts this workflow publishes, exactly as GitHub sees them:
  #
  #   * "No internal info (leak guard)"
  #   * "Lint, type-check and test (py3.10)" and "Lint, type-check and test (py3.12)"
  #     (a matrix job's context carries its parameters, so BOTH are separate contexts)
  #   * "The built wheel installs and imports"
  #
  # `main` carries no branch protection today. That is recorded rather than assumed: this list is
  # what to protect WITH, and `test_the_required_status_check_names_are_recorded_in_the_workflow`
  # is what stops a rename silently invalidating it later.
  no-internal-info:
    name: No internal info (leak guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The COMMIT-RANGE scan below needs real history; the default shallow checkout has
          # none, and `git rev-list base..head` on it FAILS rather than silently scanning zero
          # commits (the script turns that failure into exit 1 on purpose).
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      # ⭐ THE GUARD IS INSTALLED, NOT INVOKED BY PATH — because that is how every consumer runs
      # it, and the repository that OWNS the engine must not be the one place it is used
      # differently. `pip install -e .` puts the `kw-leak-guard` console script on PATH, so this
      # job exercises the exact entry point a consumer's CI calls.
      #
      # ⛔ `-e` IS LOAD-BEARING FOR THE RANGE SCAN BELOW, NOT A CONVENIENCE (#13). The guard
      # recognises its own source by PATH relative to the scanned root, and by BYTES — and only
      # the tree scan has a file's bytes; a range scan sees a diff. With an editable install
      # `__file__` resolves inside this checkout, so the path half fires and the engine's own
      # synthetic deny corpus is skipped. Installed non-editable it lives in site-packages, the
      # path half grants nothing, and `--range` over this repository's history reports that
      # corpus — measured at 105 findings on the range that added it, none of them a leak.
      # `tests/test_leak_guard_hook.py` pins this line in both workflows.
      - name: Install the package (the guard ships inside it)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Self-test the patterns, then scan the working tree
        # The self-test measures the SHIPPED patterns and reads no repository. The tree scan
        # reads this repository's own `.leakguard.json` — the injected configuration, exercised
        # on every run rather than only in a test.
        run: |
          kw-leak-guard --selftest
          kw-leak-guard
      # TWO DIFFERENT QUESTIONS, so two scans. The tree scan above answers "is the leak here
      # NOW", and it reads `git ls-files` — TRACKED files only. It is blind to a value committed
      # and then deleted, which stays permanently readable at the commit that added it.
      #
      # The range scan reads what each COMMIT added, so it sees that. Catching it before the
      # merge is the difference between an amend and a history rewrite across every clone.
      # ⭐ THE SAME STEP AS THE REUSABLE WORKFLOW, copied byte for byte (`leak-guard.yml`): the check
      # this repository runs on itself and the one every consumer runs must not be two behaviours.
      # A new branch is scanned from the default branch, not just its tip. This workflow only
      # triggers on pushes to `main`, so the tag and new-branch arms are unreachable here; they are
      # carried so the two scripts stay identical, and
      # `tests/test_workflow_steps.py::test_ci_scans_exactly_what_the_reusable_workflow_scans`
      # is what fails when they drift.
      - name: Scan what this event publishes
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          z40=0000000000000000000000000000000000000000
          case "$EVENT:$REF" in
            pull_request*)
              range="${PR_BASE}..${PR_HEAD}" ;;
            push:refs/tags/*)
              # ⭐ THE RANGE NAMES THE TAG REF, so the annotation — free prose, published on the
              # release page — is read too. Every tag at this commit is excluded from the base
              # search, or a twin tag becomes the base and the range collapses to nothing.
              excludes=""
              for t in $(git tag --points-at "$HEAD_SHA"); do excludes="$excludes --exclude=$t"; done
              # shellcheck disable=SC2086
              base="$(git describe --tags --abbrev=0 --match 'v[0-9]*' $excludes "$HEAD_SHA" \
                      2>/dev/null || true)"
              # ⚠️ The base is PEELED to its commit: the guard reads a tag object for every revision
              # the range names, so a bare `<base tag>..` would re-scan the previous release's
              # annotation, which this push does not publish.
              range="$REF"
              if [ -n "$base" ] && [ "$(git rev-list --count "${base}..${REF}")" -gt 0 ]; then
                range="${base}^{commit}..${REF}"
              else
                # ⭐ WIDER, NEVER EMPTY, AND SAID OUT LOUD. With no earlier `v[0-9]*` tag (the first
                # release) the tag publishes every commit reachable from it, so that is what is
                # scanned; an empty range is never read as clean. Every tag at this commit is
                # excluded above, so a base that exists always has commits after it - the empty
                # case here IS the no-base case, and a history older than the guard can turn the
                # first tag red. docs/ADOPTION.md says so.
                echo "::notice::no earlier v[0-9]* tag to scan from: scanning ALL history reachable from ${REF}"
              fi ;;
            push:*)
              if [ -z "$PUSH_BEFORE" ] || [ "$PUSH_BEFORE" = "$z40" ]; then
                # ⛔ A branch created by this push publishes EVERY commit the default branch does
                # not have, not just its tip: a leak added and removed on it would otherwise pass.
                # Scan from the default branch; without one to compare against — or when this IS
                # the default branch's first push, which publishes everything — all history.
                default="refs/remotes/origin/${DEFAULT_BRANCH:-}"
                range="$HEAD_SHA"
                if [ -n "${DEFAULT_BRANCH:-}" ] && [ "$REF" != "refs/heads/${DEFAULT_BRANCH}" ] \
                    && git rev-parse --verify -q "$default" >/dev/null; then
                  range="${default}..${HEAD_SHA}"
                else
                  echo "::notice::no default branch to compare against, or this IS its first push: scanning ALL history reachable from ${HEAD_SHA}"
                fi
              else
                range="${PUSH_BEFORE}..${HEAD_SHA}"
              fi ;;
            *)
              # Any other trigger (a schedule, a manual run): everything reachable, the widest scan.
              echo "::notice::this trigger has no range to start from: scanning ALL history reachable from ${HEAD_SHA}"
              range="$HEAD_SHA" ;;
          esac
          echo "range: $range"
          kw-leak-guard --range "$range"

  test:
    # ⭐ 3.10 AND 3.12, BOTH REQUIRED. `requires-python = ">=3.10"` is a promise to every consuming
    # repository, and the 3.10/3.12 split has reddened fleet CI twice — a library that claims
    # 3.10 and is only ever run on 3.12 is claiming something nobody measured. The floor is not
    # cosmetic here: `datetime.fromisoformat` learned `Z` in 3.11, and this library writes `Z`
    # into its own records.
    name: Lint, type-check and test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a 3.10-only break must be visible even when 3.12 is red too
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package and the pinned tooling
        # EXACT pins — a ruff patch can add a rule, and a linter that changes under an unchanged
        # tree reddens CI for reasons that have nothing to do with the commit. New tool versions
        # are adopted deliberately, as their own change.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install "ruff==0.16.1" "mypy==2.3.0" "pytest==9.1.1" \
                                "pytest-timeout==2.4.0"
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Test
        # `-u` so output is unbuffered: a block-buffered stdout is what makes a hung run look
        # like a slow one. The per-test timeout lives in pyproject's `addopts`.
        run: python -u -m pytest

  # The install path a consumer actually uses. Everything above runs against the working tree
  # with an editable install; NONE of it would notice a `pyproject.toml` that does not package
  # the module — a missing `packages.find`, a wrong `where`, a module left out of the wheel.
  # That failure surfaces only at `pip install` time, in the consumer's repository, after the tag
  # has been cut.
  packaging:
    name: The built wheel installs and imports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10"  # the FLOOR: the version a consumer is most likely to break on
      - name: Build the wheel and the sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      # ⭐ THE SDIST IS AN ARTIFACT TOO, and until this step nothing looked inside it. The
      # properties below have each been wrong at least once; `MANIFEST.in` keeps the running count
      # of the class in one place rather than repeating it here, where it went stale:
      #   * `tests/conftest.py` must be PRESENT — setuptools' default sdist takes `tests/test*.py`
      #     and not `conftest.py`, so the released tarball shipped tests without the autouse
      #     fixtures they depend on, including the one that makes "no test reaches the network"
      #     true. `MANIFEST.in` fixes that, and this is what keeps it fixed.
      #   * `.leakguard.json` must be PRESENT — it is an ARGUMENT for the leak-guard suite, not
      #     decoration, and a tarball without it ships tests that cannot exercise the injected
      #     configuration this release exists to add. The same failure as the conftest, one
      #     release later.
      #   * `.githooks/pre-push` must be PRESENT — `tests/test_leak_guard_hook.py` COPIES it and
      #     drives it against a real `git push`, so an sdist without it ships a suite that errors
      #     on collection. (The running count of this class lives in `MANIFEST.in`, in one place,
      #     because three copies of it disagreed.)
      #   * `scripts/` must be ABSENT — it no longer exists, and this keeps a re-vendored copy
      #     of the guard from quietly reappearing beside the packaged one. ⚠️ Exclusion is NOT
      #     what keeps private service names out of published artifacts, and reading it that way
      #     is what #16 measured going wrong: `recursive-include tests *.py` put seventeen of
      #     them into published sdists while the one test that asked looked at one module. The
      #     check that holds that line is `.githooks/pre-push`, running a guard CI deliberately
      #     does not have — `tests/test_leak_guard_hook.py` states what is and is not asserted.
      # Every one of them is one line of `MANIFEST.in` away from regressing, nothing else watching.
      - name: The sdist carries its fixtures and nothing it should not
        run: |
          set -eu
          sdist="$(ls dist/*.tar.gz)"
          echo "inspecting ${sdist}"
          names="$(tar tzf "$sdist")"
          for required in '/tests/conftest.py' '/.leakguard.json' '/.github/workflows/ci.yml' \
                          '/alerting.env.template' '/docs/alerting-setup.md' \
                          '/.githooks/pre-push'; do
            # ⛔ ANCHORED AT THE TOP OF THE TARBALL, not only on the right. `"${required}\$"` alone
            # is satisfied at ANY depth — a `vendor/tests/conftest.py` with no top-level
            # `tests/conftest.py` passed this roll-call (measured by the audit). The tarball's
            # names all begin with ONE directory (`kw_common-X.Y.Z/`), so exactly one
            # slash-free component may precede the required path.
            echo "$names" | grep -q "^[^/]*${required}\$" || {
              echo "::error::the sdist has no ${required} — its suite ships without something it"
              echo "::error::depends on. Check MANIFEST.in."
              exit 1
            }
          done
          if echo "$names" | grep -q '/scripts/'; then
            echo "::error::the sdist contains scripts/. The leak guard ships as"
            echo "::error::kw_common.leakguard now; a second vendored copy is a fork waiting to"
            echo "::error::happen. Check MANIFEST.in."
            exit 1
          fi
          echo "sdist contents are as intended"
      # ⭐⭐ RUN THE SHIPPED SUITE, rather than grepping the tarball's file list for the things we
      # currently remember it needs. That list has been wrong every time it was extended, and it
      # looked complete every time (the count and the roll-call live in `MANIFEST.in`). Unpacking
      # the sdist and running its tests is the check that cannot be out of date, because it asks
      # the question `README.md` actually promises: do the tests travel?
      - name: The sdist's own test suite passes
        run: |
          set -eu
          sdist="$(ls dist/*.tar.gz)"
          rm -rf /tmp/sdist && mkdir -p /tmp/sdist
          tar xzf "$sdist" -C /tmp/sdist
          unpacked="$(ls -d /tmp/sdist/*/)"
          python -m venv /tmp/sdisttest
          /tmp/sdisttest/bin/python -m pip install --upgrade pip
          /tmp/sdisttest/bin/python -m pip install "$unpacked"
          /tmp/sdisttest/bin/python -m pip install "pytest==9.1.1" "pytest-timeout==2.4.0"
          cd "$unpacked"
          # ⚠️ A git identity is injected per-call by the suite itself, but the tests that build
          # scratch repositories need `git` to exist and `init.defaultBranch` not to warn into an
          # assertion. The runner has git; this only pins the branch name.
          git config --global init.defaultBranch main
          /tmp/sdisttest/bin/python -u -m pytest
      # ⭐ ASKED OF THE BUILT WHEEL, NOT OF THE SOURCE TREE. `py.typed` is DATA: `packages.find`
      # does not carry it, so the file can be committed, read as done, and be absent from the
      # artifact — and nothing inside this repository would notice, because mypy here reads the
      # source directly. A consumer's mypy reads the INSTALLED package, and without this file it
      # ignores every annotation in it silently. That is the whole failure mode, so the assertion
      # is on the zip.
      - name: The wheel carries PEP 561's py.typed marker
        run: |
          set -eu
          wheel="$(ls dist/*.whl)"
          python - "$wheel" <<'PY'
          import sys, zipfile
          names = zipfile.ZipFile(sys.argv[1]).namelist()
          if "kw_common/py.typed" not in names:
              print("::error::the wheel has no kw_common/py.typed, so a consumer's mypy will")
              print("::error::ignore every annotation in this package. Check "
                    "[tool.setuptools.package-data] in pyproject.toml.")
              raise SystemExit(1)
          print("py.typed is in the wheel")
          PY
      - name: Install the wheel into a clean environment and import it
        # A throwaway venv, and `--no-index` so nothing can be silently satisfied from PyPI: this
        # asserts the library needs no third-party package at install time either.
        run: |
          set -eu
          python -m venv /tmp/consumer
          /tmp/consumer/bin/python -m pip install --upgrade pip
          /tmp/consumer/bin/python -m pip install --no-index dist/*.whl
          cd /tmp   # away from the source tree, so a passing import cannot come from `src/`
          /tmp/consumer/bin/python -c "
          import kw_common, kw_common.alerting as a, kw_common.leakguard as g
          import kw_common.alerting_env as e
          print('version:', kw_common.__version__)
          print('exports:', len(a.__all__), len(e.__all__), len(g.__all__))
          assert a.notify and a.AlertSettings and a.configure
          assert g.main and g.cli and g.load_config and g.CONFIG_FILENAME == '.leakguard.json'
          # The environment layer, from the INSTALLED package: the three variable names it
          # publishes are what a container template declares, so a wheel whose module was left
          # out of packages.find fails here rather than in a consumer's repository.
          assert e.load_alert_settings and e.load_alert_settings_from_env and e.validate_boot
          assert (e.SHARED_ROOT_VAR, e.CONFIG_PATH_VAR, e.DEPLOY_ENV_VAR) == (
              'SHARED_ROOT', 'CONFIG_PATH', 'DEPLOY_ENV')
          assert e.CONFIG_RELPATH == 'configs/alerting.env'
          "
      # ⭐ THE CONSOLE SCRIPT IS A SEPARATE CLAIM FROM THE IMPORT, and it is the one a consumer's
      # CI actually depends on. An entry point aimed at the wrong callable installs fine, imports
      # fine, and fails the first time anybody runs it — in their repository, after the tag.
      #
      # ⚠️ RUN AGAINST THIS CHECKOUT FROM AN INSTALLED GUARD — the posture every consumer is in,
      # and the one this repository would otherwise never exercise.
      #
      # ⛔ WHAT CLEARS THIS TREE, stated exactly, because the previous version of this comment got
      # it wrong in a way that would send an operator the wrong direction. `site-packages` is not
      # inside this repository, so the guard cannot recognise its own source BY PATH here — it
      # recognises it BY BYTES, which is why the engine's own synthetic deny corpus is skipped and
      # the scan is clean. `.leakguard.json` is not what clears it: its three literals are inert
      # against the shape denylist, and there is no path-exemption setting at all.
      #
      # So if this step ever REDS on the engine's own file, the answer is NOT to add an exemption
      # for it — that was tried, it was a whole-file skip written in data, and a real leak walked
      # through it (see CHANGELOG 1.1.0). The answer is that the identity test has stopped
      # working, and `tests/test_leak_guard_extraction.py` says which half.
      - name: The installed console script scans this repository
        run: |
          set -eu
          /tmp/consumer/bin/kw-leak-guard --selftest
          /tmp/consumer/bin/kw-leak-guard --repo "$GITHUB_WORKSPACE"
